<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício de Tabela</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
        }

        table {
            width: 500px;
            border-collapse: collapse;
        }

        caption {
            font-size: 1.3em;
            font-weight: bolder;
            padding: 8px;
        }

        th, td {
            border: 1px solid black;
            padding: 8px;
        }

        col.cnome {
            background-color: rgba(21, 255, 0, 0.795);
        }

        col.csexo {
            background-color: rgba(255, 255, 0, 0.808);
        }

        col.cidade {
            background-color: rgba(0, 132, 255, 0.719);
        }

        col.cprof {
            background-color: rgba(10, 201, 201, 0.808);
        }
    </style>
</head>
<body>
    <h1>Exercício de Tabela</h1>

    <table>
        <colgroup>
            <col class="cnome">
            <col class="csexo">
            <col class="cidade">
            <col class="cprof">
        </colgroup>

        <caption>Cadastro</caption>
        <tr>
            <th scope="col">Nome</th>
            <th scope="col">Sexo</th>
            <th scope="col">Idade</th>
            <th scope="col">Profissão</th>
        </tr>
        <tr>
            <td>Ana Beatriz</td>
            <td>F</td>
            <td>21</td>
            <td>Empresário(a)</td>
        </tr>
         <tr>
            <td>Gabriel Lopez</td>
            <td>M</td>
            <td>35</td>
            <td>Cantor(a)</td>
        </tr>
         <tr>
            <td>Henrique Almeida</td>
            <td>M</td>
            <td>29</td>
            <td>Porteiroa(a)</td>
        </tr>
         <tr>
            <td>Thales Werneck</td>
            <td>M</td>
            <td>23</td>
            <td>Professor(a)</td>
        </tr>
         <tr>
            <td>Aline Ferraz</td>
            <td>F</td>
            <td>28</td>
            <td>Técnico(a) de informática</td>
        </tr>
         <tr>
            <td>Igor Jesus</td>
            <td>M</td>
            <td>24</td>
            <td>Tenista</td>
        </tr>
    </table>
</body>
</html>
