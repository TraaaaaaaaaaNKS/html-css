<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário</title>
    <style>
        * {
            font-family: Arial, Helvetica, sans-serif;
            
        }
        body {
            background-image: linear-gradient( 90deg, rgb(0, 255, 170), rgb(84, 176, 219));
            background-attachment: fixed;
        }

        fieldset {
            background-image: linear-gradient(to left, rgba(0, 110, 255, 0.767), rgb(0, 60, 255));
            color: white;
            font-family: Impact, Haettenschweiler, 'Arial Narrow Bold', sans-serif;
            border: 1px solid black;
            box-shadow: 2px;
        }
        .CL {
            background-image: linear-gradient(to left, rgba(0, 110, 255, 0.767), rgb(0, 60, 255));
            color: white;
            padding: 8px;
            margin: 5px;
            width: 100px;
        }

        .CL:hover {
            background-color: blue;
            color: rgb(255, 255, 255);
            border: 1px solid rgb(38, 0, 255);
            transition: 0.5s;       
        }
        
    </style>
</head>
<body>
    <h1>Exemplo de Formulário</h1>
    <form action="cadastro.php" method="post" autocomplete="on">
        <fieldset>
            <h1>Suas informações</h1>
            <p>
                <label for="iemail">E-mail: </label>
                <input type="email" name="email" id="iemail" autocomplete="email" required>
            </p>
            <p>
                <label for="nome">Nome: </label>
                <input type="text" name="nome" id="inome" minlength="5" maxlength="25" required>
            </p>
            <p>
                <label for="itel">Telefone: </label>
                <input type="tel" name="tel" id="itel" autocomplete="tel" pattern="^(\d{2}\d{4, 5}-d\{4}$" required placeholder="(xx)xxxx-xxxx">
            </p>
            </fieldset>
                <!--Estudar mais sobre RegEx-->
            <p>
                <input type="submit" value="Enviar" class="CL">
                <input type="reset" value="Limpar" class="CL">
            </p>
    </form>

</body>
</html>
