<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabela</title>
    <style>
        
        :root {
            --cor-fundo : rgba(99, 99, 99, 0.89);
        }

        table {
            width: 600px;
            border-collapse: collapse;
        }

        th {
            border: 1px solid black;
            color: white;
             background-color: var(--cor-fundo);
        }

        tr {
            border: 1px solid black;
            text-align: center;
        }

        td {
            border: 1px solid black;
        }

        .valormedia {
            background-color: var(--cor-fundo);
            color: white;
        }

    </style>

</head>
<body>
    <table>
            <thead>
                <tr>
                    <th rowspan="2">Área</th>
                    <th rowspan="2">Disciplinas</th>
                    <th colspan="2">notas</th>
                    <th rowspan="2">Média</th>
                </tr>
                <tr>
                    <th>Nota 1</th>
                    <th>Nota 2</th>
                </tr>
            </thead>
        <tbody>
            <tr>
                <th rowspan="4">Exatas</th>
                <td>Matemática</td>
                <td>9.0</td>
                <td>7.0</td>
                <td>8.0</td>
            </tr>
            <tr>
                <td>Fisíca</td>
                <td>5.0</td>
                <td>8.0</td>
                <td>6.0</td>
            </tr>
            <tr>
                <td>Química</td>
                <td>6.0</td>
                <td>9.0</td>
                <td>7.5</td>
            </tr>
            <tr>
                <td>Biologia</td>
                <td>10</td>
                <td>8.0</td>
                <td>9.0</td>
            </tr>
            <tr>
                <th colspan="4">Média de Exatas</th>
                <td class="valormedia">7.6</td>
            </tr>
            <tr>
                <th rowspan="2">Humanas</th>
                <td>História</td>
                <td>10</td>
                <td>10</td>
                <td>10</td>
            </tr>
            <tr>
                <td>Geografia</td>
                <td>9.0</td>
                <td>7.0</td>
                <td>8.0</td>
            </tr>
            <tr>
                <th colspan="4">Média Humanas</th>
                <td class="valormedia">9.0</td>
            </tr>
        </tbody>
    </table>
</body>
</html>
